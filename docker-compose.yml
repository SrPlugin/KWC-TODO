services:
  app:
    build: .
    image: kwc-todo:latest
    container_name: kwc_todo_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_ORIGIN: https://todokwc.bytetechdev.com
      # Cuenta real del dueño creada en el primer arranque (recomendado en producción).
      # Si se define, NO se crean los usuarios demo.
      # OWNER_EMAIL: dueno@tuempresa.com
      # OWNER_PASSWORD: cambia-esto-por-una-clave-fuerte
      # OWNER_NAME: Nombre del dueño
      #
      # Si prefieres arrancar sin dueño real y sin usuarios demo:
      # SEED_DEMO_USERS: "false"
    volumes:
      - kwc_data:/app/server/data
    networks: [traefik_net]
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_net"
      traefik.http.routers.kwc-todo.rule: "Host(`todokwc.bytetechdev.com`)"
      traefik.http.routers.kwc-todo.entrypoints: "websecure"
      traefik.http.routers.kwc-todo.tls.certresolver: "letsencrypt"
      traefik.http.routers.kwc-todo.priority: "1"
      traefik.http.routers.kwc-todo.middlewares: "kwc-todo-secure-headers@file,kwc-todo-compress@file"
      traefik.http.services.kwc-todo.loadbalancer.server.port: "4000"

volumes:
  kwc_data:

networks:
  traefik_net:
    external: true
